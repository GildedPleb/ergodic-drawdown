name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip
      # The same suite measured 234ms and 658ms on this runner. The hook enforces the 10% budget.
      - run: bun run test
        env:
          SUITE_WALL: "0"
      - name: secrets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="${{ github.sha }}"
            else
              range="${before}..${{ github.sha }}"
            fi
          fi
          bun scripts/gitleaks.ts detect --redact --no-banner --log-opts="$range"

  automerge:
    name: automerge
    needs: check
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta
      - name: squash merge ranged updates
        if: |
          (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.meta.outputs.dependency-names, 'vite') &&
          !contains(steps.meta.outputs.dependency-names, 'lefthook')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash "${{ github.event.pull_request.number }}"
