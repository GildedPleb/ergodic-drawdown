# The suite wall budget is the test process clock. Run that clock after the other checks.
pre-commit:
  jobs:
    - name: static
      group:
        parallel: true
        jobs:
          - name: format
            run: bun run format
          - name: lint
            run: bun run lint
          - name: types
            run: bun run typecheck
          - name: secrets
            run: bun run secrets
    # The hook owns the 10% wall budget. CI sets SUITE_WALL=0.
    - name: test
      run: bun run test
      env:
        SUITE_WALL: "1"
