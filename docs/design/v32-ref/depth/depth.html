<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../type/type.css"><link rel="stylesheet" href="../color/color.css"><link rel="stylesheet" href="../system/space.css"><link rel="stylesheet" href="base.css"><style>
.stage{position:relative;background:var(--ground);overflow:hidden}.stage canvas{position:absolute;left:0;top:0;transform-origin:50% 100%}
.front{opacity:1}.back{opacity:.07;transform:scaleY(.94) translateY(-6px);filter:blur(.6px)}
.reads{font:600 .625rem var(--f-sans);letter-spacing:.14em;color:var(--ink-muted);border:1px solid var(--hairline);padding:1px 5px;margin-left:6px;vertical-align:2px}
.lay{position:absolute;right:14px;top:10px;font:600 .625rem var(--f-sans);letter-spacing:.16em;color:var(--ink-muted)}
.frames{display:grid;grid-template-columns:110px repeat(4,1fr);gap:8px;align-items:center}.frames .stage{box-shadow:0 0 0 1px var(--hairline)}
.ft{font:600 .625rem var(--f-sans);letter-spacing:.14em;color:var(--ink-muted);text-align:center;margin-top:3px}
</style></head><body><div class="pg" id="P"></div><script src="lib.js"></script><script src="layers.js"></script><script>
const p=+new URLSearchParams(location.search).get('p')||1;
const F=(t,l,b,n)=>`<div class="folio"><span>StackMath · Depth: two charts, one stage</span><span>${p} / 4 · ${n}</span></div><h1>${t}</h1><p class="lede">${l}</p>${b}`;
const SV='<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.8" fill="none" stroke="var(--gold)" stroke-width="1.5"/><path d="M10.2 10.2L14.5 14.5" stroke="var(--gold)" stroke-width="1.4"/></svg>';
const st=(id,w,h,mode)=>`<div class="stage" style="width:${w}px;height:${h}px"><canvas id="${id}b" class="back"></canvas><canvas id="${id}f" class="front"></canvas>${mode?`<span class="lay">${mode=='m'?'MODELS · THE WORLD':'PLANS · YOUR STACK'}</span>`:''}</div>`;
const bar=(m,ph)=>`<div class="bar" style="${ph?'font-size:.875rem;padding:8px 10px':''}">${SV}${ph?'':'Ask anything, or change your plan…'}<span class="tb" style="${ph?'margin-left:6px;gap:12px':''}"><span class="${m=='m'?'on':''}">MODELS</span><span class="${m=='m'?'':'on'}">PLANS</span><span>STATS</span></span></div>`;
const models=(sel)=>`<div><div class="ph">Models<i>what the world does</i></div><div class="gl">How prices grow</div><div class="r ${sel?'sel':''}" style="--c:var(--btc)"><span>Steady trend<small>power law · ₿ price ${f$(q.price[30][2]*1e5)} at 68</small></span><span></span></div><div class="gl">Stocks</div><div class="r" style="--c:var(--path-spx)"><span>S&P 500<small>~6.5%/yr, the reference</small></span><span></span></div><div class="gl">Dollar inflation</div><div class="r" style="--c:var(--path-infl)"><span>Typical<small>~3%/yr</small></span><span class="inf">$1 → ${f$(q.infl[30][2])}</span></div></div>`;
const plans=(sel)=>`<div><div class="ph">Plans<i>your choices</i></div><div class="gl">Living</div><div class="r ${sel?'sel':''}" style="--c:var(--plan-5)"><span>Orchid · live on $90k<small>’26 →</small></span><span class="usd">$90k/yr</span></div><div class="r" style="--c:var(--plan-6)"><span>Coral · $130k + house<small>house in ’31</small></span><span class="usd">$130k/yr</span></div><div class="gl">Stack</div><div class="r" style="--c:var(--btc)"><span>Starting stack</span><span class="btc">₿10</span></div></div>`;
const stats=()=>`<div><div class="ph">Stats<i>your plan</i><span class="reads">READS: DRAWDOWN</span></div><div class="st"><div><em>MEDIAN AT 68</em><strong class="btc">${fB(q.p5[30][2])}</strong><small>Orchid, left over</small></div><div><em>FUTURES ABOVE ₿1</em><strong>${Math.round(S.p5.filter(s=>s[30]>=1).length/N*100)}<span style="font:500 .875rem var(--f-sans)"> in 100</span></strong><small>at 68</small></div><div style="grid-column:1/3"><em>WORST 5% AT 68</em><small style="font-size:.9375rem;color:var(--ink)">${fB(q.p5[30][0])}, still the drawdown, even while Models is forward.</small></div></div></div>`;
const app=(m)=>`<div class="app">${st('d',996,330,m)}${bar(m)}<div class="dock">${models(m=='m')}${plans(m!='m')}${stats()}</div></div>`;
const S_=t=>`<div class="sx">${t}</div>`;
const pages={
1:()=>F('Plans selected · the drawdown, calm','Default view. Only your plan fans. The world sits behind at 7%: a whisper, not a line you read.',app('p')+`<div class="three" style="margin-top:10px"><p><b>Front:</b> Orchid (focused fan) and Coral (context). ₿ on a true linear scale; zero is real.</p><p><b>Behind:</b> ₿ price, S&P, inflation at 7% opacity, 94% height, 0.6px blur. Hidden from screen readers.</p><p><b>Time axis:</b> both layers share the same x scale and plot edges; depth only scales vertically, so years never drift.</p></div>`,'Plans'),
2:()=>F('Models selected · the world comes forward','The price chart takes the front; your drawdown steps back to a whisper. Same years, same stage.',app('m')+`<div class="three" style="margin-top:10px"><p><b>Front:</b> ₿ price (focused fan, $ log), S&P and “$100k today buys” as calm context, all in dollars on one axis.</p><p><b>Behind:</b> your drawdown at 7%. Pick Plans (or tap the whisper) to bring it back.</p><p><b>Stats</b> keeps reading the drawdown: it answers “what does my plan make”, whatever is forward. Model readouts live in the Models rows.</p></div>`,'Models'),
3:()=>F('Three transitions','Plans → Models, frames at 0 / 120 / 240 / 360ms. All ≤360ms; x axis locked throughout.',`<div class="frames">${['push','fade','sheet'].map(k=>`<div><p style="margin:0"><b>${{push:'1 · Push back',fade:'2 · Cross-fade',sheet:'3 · Stacked sheet'}[k]}</b></p></div>`+[0,1,2,3].map(i=>`<div>${st(k+i,200,120,'')}<div class="ft">${i*120}MS</div></div>`).join('')).join('')}</div>
<div class="three" style="margin-top:12px"><div>${S_('1 · Push back · recommended')}<p>Front layer scales to 94% height from the baseline, dims to 7% and blurs; back rises to 100%. Reads as depth without perspective, so years stay put.</p><p class="cap">320ms, cubic-bezier(.2,.7,.2,1); outgoing leads by 40ms. Reduced motion: instant swap, 120ms opacity only.</p></div><div>${S_('2 · Cross-fade')}<p>Opacity only, 240ms. Simplest and calmest, but no sense of “behind”: the layer model is invisible, so the whisper looks like noise.</p><p class="cap">240ms linear. Reduced motion: instant.</p></div><div>${S_('3 · Stacked sheet')}<p>The front chart slides down 24px like a card in a stack, revealing the one behind, which lifts. Strong metaphor, but it moves the time axis mid-flight and fights the drawer gesture.</p><p class="cap">360ms. Reduced motion: instant. A card flip was rejected: it breaks axis alignment for half the move.</p></div></div><p class="cap" style="margin-top:6px">All three: only the active chart is in the accessibility tree (back layer aria-hidden + inert); the switch announces “Showing the world: ₿ price, S&P, inflation” / “Showing your plan”.</p>`,'Transitions'),
4:()=>F('On the phone','390px, drawer at half. Left: Plans (default). Right: Models forward.',`<div style="display:flex;gap:40px;justify-content:center">${['p','m'].map(m=>`<div class="phone">${st('ph'+m,320,240,m)}${bar(m,1)}<div style="padding:2px 12px 12px;background:var(--surface)">${m=='m'?`<div class="r sel" style="--c:var(--btc)"><span>Steady trend<small>power law</small></span><span></span></div><div class="r" style="--c:var(--path-infl)"><span>Inflation · Typical<small>~3%/yr</small></span><span class="inf">$1 → ${f$(q.infl[30][2])}</span></div>`:`<div class="r sel" style="--c:var(--plan-5)"><span>Orchid · live on $90k<small>’26 →</small></span><span class="usd">$90k/yr</span></div><div class="r" style="--c:var(--plan-6)"><span>Coral · $130k + house<small>’31</small></span><span class="usd">$130k/yr</span></div>`}</div></div>`).join('')}</div>`,'Phone')};
document.getElementById('P').innerHTML=pages[p]();
const set=(id,mode)=>{const f=document.getElementById(id+'f'),b=document.getElementById(id+'b');return{f,b}};
const draw=(id,w,h,mode,small)=>{const {f,b}=set(id);if(mode=='m'){PX(f,w,h,small);DD(b,w,h,small)}else{DD(f,w,h,small);PX(b,w,h,small)}};
const sty=(el,o)=>{const [op,tr,fl]=o.split(';').map(v=>v.split(':').slice(1).join(':'));el.style.opacity=op;el.style.transform=tr;el.style.filter=fl};
const frame=(id,k,i)=>{const {f,b}=set(id);const t=i/3,e=1-Math.pow(1-t,3);// f=drawdown(front at start), b=price
 if(k=='push'){sty(f,`opacity:${1-.93*e};transform:scaleY(${1-.06*e}) translateY(${-6*e}px);filter:blur(${.6*e}px)`);sty(b,`opacity:${.07+.93*e};transform:scaleY(${.94+.06*e}) translateY(${-6+6*e}px);filter:blur(${.6-.6*e}px)`);if(e>.5){b.style.zIndex=2}}
 if(k=='fade'){sty(f,`opacity:${1-.93*t};transform:none;filter:none`);sty(b,`opacity:${.07+.93*t};transform:none;filter:none`)}
 if(k=='sheet'){sty(f,`opacity:${1-.93*e};transform:translateY(${24*e}px);filter:none`);sty(b,`opacity:${.07+.93*e};transform:translateY(${-8+8*e}px);filter:none`)}};
Promise.all(['500 12px "SM Jost"','600 12px "SM Jost"','italic 400 13px "SM EB Garamond"'].map(f=>document.fonts.load(f,'₿×'))).then(()=>{
 if(p<=2)draw('d',996,330,p==2?'m':'p');
 if(p==3)for(const k of ['push','fade','sheet'])for(let i=0;i<4;i++){const {f,b}=set(k+i);DD(f,200,120,2);PX(b,200,120,2);frame(k+i,k,i)}
 if(p==4){draw('php',320,240,'p',1);draw('phm',320,240,'m',1)}
 document.title='ready'});
document.fonts.ready.then(()=>{});
</script></body></html>
